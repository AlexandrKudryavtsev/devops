apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy-account
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: alloy-config
              mountPath: /etc/alloy
              readOnly: true
            - name: alloy-state
              mountPath: /var/lib/alloy
              readOnly: false
          args:
            - run
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.alloy
      volumes:
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: alloy-config
          configMap:
            name: alloy-configmap
        - name: alloy-state
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate