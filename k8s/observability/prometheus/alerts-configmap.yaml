apiVersion: v1
data:
  alerts.yml: |-
    groups:
      - name: infrastructure
        rules:
          - alert: NodeExporterDown
            expr: up{job="node-exporter"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Node Exporter недоступен"
              description: "Не удается получить метрики с ноды {{ $labels.node }}"
kind: ConfigMap
metadata:
  name: alerts-configmap
  namespace: monitoring
