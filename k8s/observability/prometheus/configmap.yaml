apiVersion: v1
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: node-exporter-agent

          - source_labels:
              - __meta_kubernetes_pod_node_name
            action: replace
            target_label: node
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
