apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - namespace.yaml
  - manifests/node-exporter/daemonset.yaml
  - manifests/prometheus/rbac.yaml
  - manifests/prometheus/deployment.yaml
  - manifests/prometheus/pvc.yaml
  - manifests/grafana/deployment.yaml
  - manifests/alertmanager/deployment.yaml
  - manifests/grafana/pvc.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - configs/prometheus/prometheus.yml
  - name: alerts-configmap
    files:
      - configs/prometheus/alerts.yml
  - name: grafana-datasources
    files:
      - configs/grafana/datasources.yml
  - name: grafana-provider
    files:
      - configs/grafana/dashboard-provider.yml
  - name: grafana-dashboards
    files:
      - configs/grafana/dashboards/minikube-overview.json
  - name: alertmanager-configmap
    files:
      - configs/alertmanager/alertmanager.yml