auth_enabled: false

server:
  http_listen_port: 3100

common:
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  path_prefix: /loki

schema_config:
  configs:
    - from: 2026-10-15
      schema: v13
      store: tsdb
      object_store: filesystem
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks