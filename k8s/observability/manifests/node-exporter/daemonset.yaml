apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter-agent
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter-agent
  template:
    metadata:
      labels:
        app: node-exporter-agent
    spec:
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter
          ports:
            - name: http
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
          args:
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/host/root"
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-service
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9100
      targetPort: http
  selector:
    app: node-exporter-agent