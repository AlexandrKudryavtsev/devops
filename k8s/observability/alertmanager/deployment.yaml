apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.1
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: alertmanager-configmap
              mountPath: /etc/alertmanager
              readOnly: true
            - name: telegram-bot-token
              mountPath: /etc/alertmanager/secrets
              readOnly: true
      volumes:
        - name: alertmanager-configmap
          configMap:
            name: alertmanager-configmap
        - name: telegram-bot-token
          secret:
            secretName: telegram-bot-token
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-service
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http