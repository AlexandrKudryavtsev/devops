apiVersion: v1
data:
  alertmanager.yml: |-
    route:
      receiver: telegram
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 5m

    receivers:
      - name: telegram
        telegram_configs:
          - send_resolved: true
            chat_id: 1107630696
            bot_token_file: /etc/alertmanager/secrets/bot-token
kind: ConfigMap
metadata:
  name: alertmanager-configmap
  namespace: monitoring
