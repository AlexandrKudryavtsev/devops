apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: study
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: wrong-image:1.27
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/sh", "-c"]
          args: 
            - |
              echo "<h1>Hello from Pod: $POD_NAME</h1>" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: study
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: node-web
  namespace: study
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 8081
      nodePort: 30080
      targetPort: http