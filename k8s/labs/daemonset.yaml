apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: monitoring-agent
  namespace: study
spec:
  selector:
    matchLabels:
      app: monitoring-agent
  template:
    metadata:
      labels:
        app: monitoring-agent
    spec:
      nodeSelector:
        monitoring: enabled
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]