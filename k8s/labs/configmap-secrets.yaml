apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
  namespace: study
data:
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: study
type: Opaque
stringData:
  username: "appuser"
  password: "practice-pass"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: study
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: credentials
              mountPath: /etc/app-credentials
              readOnly: true
          envFrom:
            - configMapRef:
                name: app-settings
      volumes:
        - name: credentials
          secret:
            secretName: app-secrets